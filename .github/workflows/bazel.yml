name: Bazel CI

on:
  push:
    branches: [ main, master, bazel-build ]
  pull_request:
    branches: [ main, master, bazel-build ]

jobs:
  bazel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout libobjc2
        uses: actions/checkout@v4
        with:
          path: libobjc2-bazel

      - name: Checkout tools-make (bazel-build)
        uses: actions/checkout@v4
        with:
          repository: ivucica/tools-make
          ref: bazel-build
          path: tools-make-bazel

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true

      - name: Build and Test with Bazel
        working-directory: libobjc2-bazel
        env:
          CC: clang
          CXX: clang++
        run: |
          bazel build //:objc //:allocate_pair_bin
          bazel test //:AllocatePair_test //:BlockTest_arc_test //:PropertyIntrospectionTest2_arc_test
